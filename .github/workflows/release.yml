name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build artifacts
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION}"
          build() {
            out="dist/patreon-posts_${VERSION}_$1_$2$3"
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$ldflags" -o "$out" .
            echo "built $out"
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  arm64 ""
          # The Scoop bucket (wolffshots/scoop-bucket) downloads these two by
          # name and reads their hashes from checksums.txt, so keep the naming.
          build windows amd64 ".exe"
          build windows arm64 ".exe"
          (cd dist && sha256sum patreon-posts_* > checksums.txt)
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "patreon-posts ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
